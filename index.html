<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herat Historical Mosques</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>مساجد تاریخی هرات</h1>
      <p>Herat Historical Mosques</p>
    </header>

    <main class="gallery">
      <div class="main-image" id="mainImage">
        <img id="bigImage" src="images/jami.jpg" alt="مسجد جامع هرات" />

        <div class="mosque-title">
          <h2 id="mosqueName">مسجد جامع هرات</h2>
        </div>

        <div class="description">
          <p id="mosqueInfo">
            مسجد جامع هرات یکی از آثار تاریخی و ارزشمند افغانستان است که با
            معماری اسلامی و کاشی‌کاری‌های زیبا شناخته می‌شود.
          </p>
        </div>

        <button class="arrow prev" id="prev">❯</button>
        <button class="arrow next" id="next">❮</button>
      </div>

      <div class="side-images" id="sideImages"></div>
    </main>

    <footer>
      <p>Discover the History of Herat</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
